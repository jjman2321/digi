<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Digi booth strip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600;700&amp;family=Silkscreen:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FF7DBE}a:hover{color:#FFB3D6}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B0E; display: flex; flex-direction: column; align-items: center; font-family: 'Inter', system-ui, sans-serif; color: #FFFFFF; overflow: hidden; position: relative">
  <div aria-hidden="true" style="position: absolute; top: 90px; left: 30px; width: 330px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(255,79,163,0.3) 0%, rgba(255,79,163,0) 70%)"></div>
  <div style="position: relative; align-self: stretch; display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 4px">
    <a href="Camera.dc.html" aria-label="Back to camera" style="width: 44px; height: 44px; border-radius: 50%; background: #1C1C22; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-family: 'Silkscreen', monospace; font-size: 15px; letter-spacing: 1px">BOOTH MODE</span>
    <span style="width: 44px"></span>
  </div>

  <h1 style="position: relative; margin: 4px 0 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 34px">Your <em style="color: #FF4FA3">strip</em> is ready</h1>

  <div style="position: relative; margin-top: 18px; width: 268px; padding: 12px 12px 0; background: #FAF7F8; border-radius: 6px; transform: rotate(2deg); box-shadow: 0 22px 50px rgba(0,0,0,0.6)">
    <img src="../images/booth.png" alt="Four booth shots of two friends: smiling, silly faces, hugging, laughing" style="display: block; width: 244px; height: 244px; object-fit: cover">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 2px 12px">
      <span style="font-family: 'Silkscreen', monospace; font-size: 12px; color: #D6267F">digi.pink</span>
      <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 16px; color: #1A0010">girls night · 11.17.26</span>
    </div>
  </div>

  <div style="position: relative; align-self: stretch; padding: 30px 16px 0">
    <span style="display: block; padding: 0 4px 10px; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: #A6A6B3">FRAME</span>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <button style="height: 76px; border: 2px solid #FF4FA3; border-radius: 16px; background: #2A1420; font-family: inherit; font-size: 13px; font-weight: 700; color: #FFFFFF; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
        <span aria-hidden="true" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; width: 24px"><span style="height: 11px; background: #FF4FA3"></span><span style="height: 11px; background: #FF4FA3"></span><span style="height: 11px; background: #FF4FA3"></span><span style="height: 11px; background: #FF4FA3"></span></span>
        <span>4-cut</span>
      </button>
      <button style="height: 76px; border: 0; border-radius: 16px; background: #1C1C22; font-family: inherit; font-size: 13px; font-weight: 600; color: #D9D9E0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
        <span aria-hidden="true" style="display: flex; flex-direction: column; gap: 2px; width: 11px"><span style="height: 6px; background: #8C8C99"></span><span style="height: 6px; background: #8C8C99"></span><span style="height: 6px; background: #8C8C99"></span><span style="height: 6px; background: #8C8C99"></span></span>
        <span>Strip</span>
      </button>
      <button style="height: 76px; border: 0; border-radius: 16px; background: #1C1C22; font-family: inherit; font-size: 13px; font-weight: 600; color: #D9D9E0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
        <span aria-hidden="true" style="width: 20px; height: 24px; background: #D9D9E0; box-sizing: border-box; padding: 2px 2px 7px"><span style="display: block; width: 100%; height: 100%; background: #55555F"></span></span>
        <span>Polaroid</span>
      </button>
      <button style="height: 76px; border: 0; border-radius: 16px; background: #1C1C22; font-family: inherit; font-size: 13px; font-weight: 600; color: #D9D9E0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z" fill="#8C8C99"></path></svg>
        <span>Y2K</span>
      </button>
    </div>
  </div>

  <div style="position: relative; align-self: stretch; padding: 18px 16px 0">
    <label for="caption" style="display: block; padding: 0 4px 8px; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: #A6A6B3">CAPTION</label>
    <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-radius: 16px; background: #1C1C22">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF4FA3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>
      <input id="caption" value="girls night" style="flex-grow: 1; border: 0; background: transparent; color: #FFFFFF; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 20px; outline: none">
      <span style="font-size: 12px; color: #8C8C99">+ date</span>
    </div>
  </div>
  <div style="flex-grow: 1"></div>
  <div style="position: relative; align-self: stretch; display: flex; gap: 10px; padding: 0 16px 26px">
    <a href="Camera.dc.html" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #1C1C22; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">Shoot again</a>
    <a href="Paywall.dc.html" style="flex: 1.5 1 0; display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border-radius: 999px; background: #FF4FA3; box-shadow: 0 10px 30px rgba(255,79,163,0.45); color: #1A0010; font-size: 16px; font-weight: 700; text-decoration: none">
      <span>Save strip</span>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
