<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B0E; display: flex; flex-direction: column; font-family: 'Inter', system-ui, sans-serif; color: #FFFFFF; overflow: hidden">

    <a href="Roll.dc.html" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; background: #1C1C22; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none">
      <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #FF4FA3; box-shadow: 0 0 8px #FF4FA3"></span>

        <div style="position: absolute; top: 9px; left: 10px; display: flex; align-items: center; gap: 8px; font-family: 'Silkscreen', monospace; font-size: 12px; text-shadow: 0 1px 2px rgba(0,0,0,0.85)">

          <span>3.2M</span>
        </div>
        <span style="position: absolute; top: 9px; right: 10px; font-family: 'Silkscreen', monospace; font-size: 12px; color: #FFE45C; text-shadow: 0 1px 2px rgba(0,0,0,0.85)">FLASH</span>
        <div style="position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px">

        </div>
        <span style="position: absolute; bottom: 10px; right: 10px; font-family: 'Silkscreen', monospace; font-size: 16px; color: #FF9A2E; text-shadow: 0 0 6px rgba(255,120,30,0.9)">11 17 '26</span>
      </div>
    </div>
  </div>

  <div style="display: flex; justify-content: center; gap: 20px; padding: 18px 0 0; font-size: 13px; font-weight: 700; letter-spacing: 1.5px">
    <span style="color: #9A9AA8">Y2K</span>
    <span style="color: #9A9AA8">FILM</span>
    <span style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #FFFFFF">DIGICAM<span aria-hidden="true" style="width: 5px; height: 5px; border-radius: 50%; background: #FF4FA3"></span></span>
    <a href="Booth.dc.html" style="color: #9A9AA8; text-decoration: none">STRIP</a>
    <span style="color: #9A9AA8">XMAS</span>
  </div>

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: space-between; padding: 0 30px 10px">
    <a href="Result.dc.html" aria-label="Last digi, 6 in this roll" style="position: relative; width: 52px; height: 52px; border-radius: 12px; border: 2px solid #FFFFFF; transform: rotate(-6deg)">
      <img src="../../images/selfie.png" alt="" style="width: 100%; height: 100%; object-fit: cover; border-radius: 10px">
      <span style="position: absolute; top: -8px; right: -8px; width: 22px; height: 22px; border-radius: 50%; background: #FF4FA3; color: #1A0010; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">6</span>

    <a href="Developing.dc.html" aria-label="Take photo" style="width: 84px; height: 84px; border-radius: 50%; border: 4px solid #FFFFFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px rgba(255,79,163,0.35)">
      <span style="width: 66px; height: 66px; border-radius: 50%; background: #FFFFFF"></span>
    </a>
    <a href="Looks.dc.html" aria-label="All looks" style="width: 52px; height: 52px; border-radius: 50%; background: #1C1C22; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="5.5"></circle><circle cx="15" cy="9" r="5.5"></circle><circle cx="12" cy="15" r="5.5"></circle></svg>
    </a>
