<title>Digi Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one phone screen you tap through; on wide screens the flow list sits beside it. Dark only, like the camera. */
:root{
  --bg:#0B0B0E; --panel:#141418; --line:#26262E; --fg:#FFFFFF; --sub:#B4B4C0; --mute:#8E8E9C;
  --pink:#FF4FA3; --on-pink:#1A0010; --stamp:#FF9A2E;
  --display:'Silkscreen',ui-monospace,monospace; --body:'Inter',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{display:flex;gap:40px;justify-content:center;align-items:flex-start;padding-block:16px 24px}
.stage{display:flex;flex-direction:column;gap:12px;width:min(390px,100%,calc((100vh - 110px) * 390 / 844))}
.bar{display:flex;align-items:center;gap:8px}
.bar .name{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .name small{font-family:var(--display);font-size:11px;color:var(--pink);margin-right:8px;letter-spacing:.06em}
button{font:inherit;color:inherit;cursor:pointer}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--pink);color:var(--on-pink);border-color:var(--pink)}
.chip:focus-visible,.spot:focus-visible,.nav button:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.phone{position:relative;width:100%;aspect-ratio:390/844;max-width:100%;border-radius:34px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(255,79,163,.12)}
.phone img{position:absolute;inset:0;width:100%;height:100%;display:block}
.spot{position:absolute;border:0;padding:0;background:transparent;border-radius:14px}
.show .spot{background:rgba(255,79,163,.18);box-shadow:inset 0 0 0 2px var(--pink)}
.hint{font-size:13px;color:var(--mute);text-align:center}
.nav{width:260px;flex-shrink:0;display:flex;flex-direction:column;gap:18px;padding-top:48px}
.nav h2{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--pink);margin:0 0 6px}
.nav ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav button{width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:10px;color:var(--sub);font-size:14px;min-height:40px}
.nav button[aria-current="true"]{background:var(--panel);color:var(--fg);font-weight:700;box-shadow:inset 3px 0 0 var(--pink)}
.nav p{margin:0;font-size:13px;color:var(--mute);line-height:1.5}
@media (max-width:760px){.nav{display:none}.wrap{padding-block:8px 16px}}
@media (prefers-reduced-motion:no-preference){.phone img{transition:opacity .15s}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap">
<div class="wrap">
  <main class="stage">
    <div class="bar">
      <div class="name" id="name" aria-live="polite"></div>
      <button class="chip" id="back" type="button" aria-label="Previous screen">Back</button>
      <button class="chip" id="spots" type="button" aria-pressed="false">Tap spots</button>
      <button class="chip" id="restart" type="button">Restart</button>
    </div>
    <div class="phone" id="phone"><img id="shot" alt=""></div>
    <p class="hint" id="hint">Tap the buttons on the screen like the real app.</p>
  </main>
  <nav class="nav" aria-label="All screens" id="nav"></nav>
</div>
<script>
const FLOW = [{"id": "tap-it", "name": "Tap it", "hotspots": [{"label": "Tap it.", "to": "wow", "x": 155, "y": 624, "w": 80, "h": 44}, {"label": "[aria-label]|shutter", "to": "wow", "x": 152, "y": 674, "w": 84, "h": 84}]}, {"id": "wow", "name": "That's a digi", "hotspots": [{"label": "Let's go", "to": "occasion", "x": 20, "y": 758, "w": 350, "h": 56}]}, {"id": "occasion", "name": "Occasion", "hotspots": [{"label": "Birthday", "to": "look", "x": 20, "y": 241, "w": 170, "h": 150}, {"label": "House party", "to": "look", "x": 200, "y": 241, "w": 170, "h": 150}, {"label": "Night out", "to": "look", "x": 20, "y": 401, "w": 170, "h": 150}, {"label": "Holidays", "to": "look", "x": 200, "y": 401, "w": 170, "h": 150}, {"label": "Wedding", "to": "look", "x": 20, "y": 561, "w": 170, "h": 150}, {"label": "Just us", "to": "look", "x": 200, "y": 561, "w": 170, "h": 150}, {"label": "Skip", "to": "look", "x": 330, "y": 14, "w": 44, "h": 44}]}, {"id": "look", "name": "Pick your look", "hotspots": [{"label": "Use Digicam", "to": "who", "x": 20, "y": 760, "w": 350, "h": 56}, {"label": "Skip", "to": "who", "x": 330, "y": 14, "w": 44, "h": 44}]}, {"id": "who", "name": "Who's in your pics", "hotspots": [{"label": "Mostly me", "to": "gender", "x": 20, "y": 200, "w": 350, "h": 172}, {"label": "Me + a few friends", "to": "gender", "x": 20, "y": 384, "w": 350, "h": 172}, {"label": "The whole group", "to": "gender", "x": 20, "y": 568, "w": 350, "h": 172}, {"label": "Skip", "to": "gender", "x": 330, "y": 14, "w": 44, "h": 44}]}, {"id": "gender", "name": "Gender (optional)", "hotspots": [{"label": "Woman", "to": "source", "x": 20, "y": 260, "w": 350, "h": 84}, {"label": "Man", "to": "source", "x": 20, "y": 354, "w": 350, "h": 84}, {"label": "Non-binary", "to": "source", "x": 20, "y": 448, "w": 350, "h": 84}, {"label": "Prefer not to say", "to": "source", "x": 20, "y": 542, "w": 350, "h": 84}, {"label": "Skip", "to": "source", "x": 330, "y": 14, "w": 44, "h": 44}]}, {"id": "source", "name": "How you found us", "hotspots": [{"label": "TikTok", "to": "ready", "x": 20, "y": 241, "w": 170, "h": 132}, {"label": "Instagram", "to": "ready", "x": 200, "y": 241, "w": 170, "h": 132}, {"label": "A friend", "to": "ready", "x": 20, "y": 383, "w": 170, "h": 132}, {"label": "App Store", "to": "ready", "x": 200, "y": 383, "w": 170, "h": 132}, {"label": "YouTube", "to": "ready", "x": 20, "y": 525, "w": 170, "h": 132}, {"label": "Other", "to": "ready", "x": 200, "y": 525, "w": 170, "h": 132}, {"label": "Skip", "to": "ready", "x": 330, "y": 14, "w": 44, "h": 44}]}, {"id": "ready", "name": "Camera's ready", "hotspots": [{"label": "Open my camera", "to": "camera", "x": 20, "y": 716, "w": 350, "h": 56}]}, {"id": "camera", "name": "Camera", "hotspots": [{"label": "AFTER DARK \u2726", "to": "free", "x": 171, "y": 603, "w": 113, "h": 44}, {"label": "2 FREE DIGIS \u2726", "to": "free", "x": 0, "y": 748, "w": 390, "h": 44}]}, {"id": "free", "name": "Free digi Friday", "hotspots": [{"label": "Try After Dark \u2726", "to": "consent", "x": 20, "y": 758, "w": 350, "h": 56}, {"label": "Invite", "to": "free", "x": 20, "y": 680, "w": 350, "h": 64}]}, {"id": "consent", "name": "First After Dark", "hotspots": [{"label": "Make it After Dark \u2726", "to": "developing", "x": 20, "y": 732, "w": 350, "h": 56}]}, {"id": "developing", "name": "Developing", "hotspots": [{"label": "Lights", "to": "result", "x": 109, "y": 515, "w": 171, "h": 44}, {"label": "Keep shooting", "to": "result", "x": 20, "y": 762, "w": 350, "h": 54}]}, {"id": "result", "name": "Your After Dark", "hotspots": [{"label": "Share", "to": "paywall", "x": 14, "y": 608, "w": 242, "h": 54}, {"label": "Save", "to": "paywall", "x": 266, "y": 608, "w": 110, "h": 54}, {"label": "Make it Live \u2726 3", "to": "pack", "x": 14, "y": 672, "w": 176, "h": 52}, {"label": "Make a strip \u2726 2", "to": "pack", "x": 200, "y": 672, "w": 176, "h": 52}]}, {"id": "paywall", "name": "Digi Plus", "hotspots": [{"label": "Start my 3 free days", "to": "camera", "x": 20, "y": 686, "w": 350, "h": 58}, {"label": "Just tonight? 25 digis \u00b7 $5.99", "to": "pack", "x": 20, "y": 790, "w": 350, "h": 44}, {"label": "[x]", "to": "camera", "x": 330, "y": 12, "w": 44, "h": 44}]}, {"id": "pack", "name": "Out of digis", "hotspots": [{"label": "Get 25 digis \u00b7 $5.99", "to": "camera", "x": 20, "y": 657, "w": 350, "h": 58}, {"label": "See Plus", "to": "paywall", "x": 20, "y": 750, "w": 350, "h": 64}]}];
const GROUPS = [["Onboarding", ["tap-it", "wow", "occasion", "look", "who", "gender", "source", "ready"]], ["Camera", ["camera", "free"]], ["After Dark \u2726", ["consent", "developing", "result"]], ["Money", ["paywall", "pack"]]];
const byId = Object.fromEntries(FLOW.map((s) => [s.id, s]));
const phone = document.getElementById('phone'), shot = document.getElementById('shot');
const nameEl = document.getElementById('name'), nav = document.getElementById('nav');
let history = [];

nav.innerHTML = GROUPS.map(([g, ids]) => `<section><h2>${g}</h2><ol>${ids.map((id) => `<li><button type="button" data-go="${id}">${byId[id].name}</button></li>`).join('')}</ol></section>`).join('')
  + '<p>Picked design, rounds 3 to 9, drawn at iPhone size. Tap the buttons on the screen, or jump to any screen here.</p>';
nav.addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go, true); });

function groupOf(id) { const g = GROUPS.find(([, ids]) => ids.includes(id)); return g ? g[0] : ''; }
function show(id) {
  const s = byId[id] || FLOW[0];
  shot.src = 'screens/' + s.id + '.jpg';
  shot.alt = s.name + ' screen';
  nameEl.innerHTML = `<small>${groupOf(s.id).toUpperCase()}</small>${s.name}`;
  phone.querySelectorAll('.spot').forEach((n) => n.remove());
  s.hotspots.forEach((h) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'spot';
    b.setAttribute('aria-label', h.label.replace(/^\[.*\]\|?/, '') || 'Next');
    Object.assign(b.style, { left: (h.x / 390 * 100) + '%', top: (h.y / 844 * 100) + '%', width: (h.w / 390 * 100) + '%', height: (h.h / 844 * 100) + '%' });
    b.addEventListener('click', () => go(h.to, true));
    phone.appendChild(b);
  });
  nav.querySelectorAll('[data-go]').forEach((b) => b.setAttribute('aria-current', String(b.dataset.go === s.id)));
  document.getElementById('back').disabled = history.length === 0;
}
function go(id, push) {
  const cur = (location.hash || '#' + FLOW[0].id).slice(1);
  if (push && cur !== id) history.push(cur);
  if (location.hash.slice(1) !== id) location.hash = id; else show(id);
}
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
document.getElementById('back').addEventListener('click', () => { const p = history.pop(); if (p) { location.hash = p; } });
document.getElementById('restart').addEventListener('click', () => { history = []; go(FLOW[0].id, false); });
document.getElementById('spots').addEventListener('click', (e) => { const on = e.currentTarget.getAttribute('aria-pressed') !== 'true'; e.currentTarget.setAttribute('aria-pressed', String(on)); phone.classList.toggle('show', on); });
// a wrong tap flashes the tap spots so nobody gets stuck
phone.addEventListener('click', (e) => { if (e.target === shot) { phone.classList.add('show'); setTimeout(() => { if (document.getElementById('spots').getAttribute('aria-pressed') !== 'true') phone.classList.remove('show'); }, 700); } });
FLOW.forEach((s) => { const i = new Image(); i.src = 'screens/' + s.id + '.jpg'; });
show((location.hash || '#' + FLOW[0].id).slice(1));
</script>
